version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocyclo
    - misspell
    - gocritic

formatters:
  enable:
    - gofmt

settings:
  errcheck:
    check-type-assertions: true

issues:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck